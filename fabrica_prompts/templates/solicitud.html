<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fábrica de Prompts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  body { background: #f5f6f8; }
  pre.resultado { white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>

<header>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container" style="max-width: 800px;">
      <span class="navbar-brand mb-0 h1">🏭 Fábrica de Prompts</span>
    </div>
  </nav>
</header>

<main class="container pb-5" style="max-width: 800px;">

  <section class="card shadow-sm mb-4" aria-label="Generar prompt">
    <div class="card-body">
      <form novalidate id="form-solicitud">
        <div class="form-floating mb-3">
          <textarea class="form-control" id="solicitud" name="solicitud" style="height: 8rem"
            required minlength="3" placeholder="Describí qué tipo de prompt necesitás..."></textarea>
          <label for="solicitud">¿Qué prompt necesitás?</label>
          <div class="invalid-feedback">Escribí al menos 3 caracteres.</div>
        </div>
        <button type="submit" class="btn btn-primary" id="btn-generar">
          <i class="bi bi-stars" aria-hidden="true"></i> Generar
        </button>
      </form>

      <div class="mt-3 d-none" id="progreso-wrap">
        <div class="progress" role="progressbar" aria-label="Progreso de generación"
             aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-bar progress-bar-striped progress-bar-animated" id="progreso-bar" style="width: 0%"></div>
        </div>
        <p class="text-muted small mt-1 mb-0" id="progreso-label" aria-live="polite"></p>
      </div>
    </div>
  </section>

  <section id="salida" aria-live="polite"></section>

</main>

<template id="tpl-error">
  <div class="alert alert-danger d-flex align-items-start gap-2" role="alert">
    <i class="bi bi-exclamation-octagon-fill fs-5" aria-hidden="true"></i>
    <div data-campo="mensaje"></div>
  </div>
</template>

<template id="tpl-resultado">
  <article class="card shadow-sm">
    <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2 bg-white">
      <span class="badge text-bg-secondary">
        <i class="bi bi-tag-fill" aria-hidden="true"></i> <span data-campo="dominio"></span>
      </span>
      <button class="btn btn-sm btn-outline-secondary d-none" type="button" id="btn-copiar"
        aria-label="Copiar el prompt generado al portapapeles">
        <i class="bi bi-clipboard" aria-hidden="true"></i> Copiar
      </button>
    </div>
    <div class="card-body">
      <div class="alert alert-warning d-flex align-items-start gap-2 d-none" role="alert" data-campo="advertencia-wrap">
        <i class="bi bi-exclamation-triangle-fill fs-5" aria-hidden="true"></i>
        <div>El resultado no parece un prompt (instrucción para una IA), sino una respuesta directa — revisalo antes de usarlo.</div>
      </div>

      <div class="alert alert-warning mb-0 d-none" role="alert" data-campo="vacio-wrap">
        La crew terminó sin generar un prompt final.
      </div>

      <div data-campo="texto-wrap">
        <pre class="resultado border rounded p-3 bg-body-tertiary mb-2" data-campo="texto"></pre>
        <div class="alert alert-light border small mb-0 d-none" style="white-space: pre-line;" data-campo="uso"></div>
      </div>
    </div>
  </article>
</template>

<script>
(function () {
  var PASOS = {{ pasos | tojson }};
  var form = document.getElementById('form-solicitud');
  var btn = document.getElementById('btn-generar');
  var progresoWrap = document.getElementById('progreso-wrap');
  var progresoBar = document.getElementById('progreso-bar');
  var progresoLabel = document.getElementById('progreso-label');
  var salida = document.getElementById('salida');
  var poll = null;

  function llenar(tpl, datos) {
    var nodo = tpl.content.cloneNode(true);
    Object.keys(datos).forEach(function (campo) {
      var el = nodo.querySelector('[data-campo="' + campo + '"]');
      if (el) el.textContent = datos[campo];
    });
    return nodo;
  }

  function mostrar(sel, nodo, visible) {
    var el = nodo.querySelector(sel);
    if (el) el.classList.toggle('d-none', !visible);
  }

  function reiniciarUI() {
    salida.innerHTML = '';
    progresoWrap.classList.remove('d-none');
    progresoBar.style.width = '0%';
    progresoBar.closest('.progress').setAttribute('aria-valuenow', '0');
    progresoLabel.textContent = 'Paso 0/' + PASOS.length + '…';
    btn.disabled = true;
  }

  function actualizarProgreso(paso, total) {
    var pct = Math.round((paso / total) * 100);
    progresoBar.style.width = pct + '%';
    progresoBar.closest('.progress').setAttribute('aria-valuenow', String(pct));
    var etiqueta = paso < total ? PASOS[paso] : 'Finalizando';
    progresoLabel.textContent = 'Paso ' + paso + '/' + total + ': ' + etiqueta + '…';
  }

  function mostrarError(mensaje) {
    var tpl = document.getElementById('tpl-error');
    salida.appendChild(llenar(tpl, { mensaje: mensaje }));
  }

  function mostrarResultado(resultado) {
    var tpl = document.getElementById('tpl-resultado');
    var nodo = llenar(tpl, {
      dominio: resultado.dominio_nombre + ' (' + resultado.dominio_codigo + ')',
      texto: resultado.texto,
      uso: resultado.uso || '',
    });

    mostrar('[data-campo="advertencia-wrap"]', nodo, resultado.advertencia_formato);
    mostrar('[data-campo="vacio-wrap"]', nodo, resultado.vacio);
    mostrar('[data-campo="texto-wrap"]', nodo, !resultado.vacio);
    mostrar('[data-campo="uso"]', nodo, !resultado.vacio && !!resultado.uso);

    var btnCopiar = nodo.querySelector('#btn-copiar');
    if (btnCopiar && !resultado.vacio) {
      btnCopiar.classList.remove('d-none');
      btnCopiar.addEventListener('click', function () {
        navigator.clipboard.writeText(resultado.texto).then(function () {
          btnCopiar.innerHTML = '<i class="bi bi-check-lg" aria-hidden="true"></i> Copiado';
          setTimeout(function () {
            btnCopiar.innerHTML = '<i class="bi bi-clipboard" aria-hidden="true"></i> Copiar';
          }, 2000);
        });
      });
    }

    salida.appendChild(nodo);
  }

  function detener() {
    if (poll) { clearInterval(poll); poll = null; }
    progresoWrap.classList.add('d-none');
    btn.disabled = false;
  }

  function consultarEstado(jobId) {
    poll = setInterval(function () {
      fetch('/estado/' + jobId)
        .then(function (r) { return r.json(); })
        .then(function (job) {
          if (job.error && !job.listo) {
            detener();
            mostrarError(job.error);
            return;
          }
          actualizarProgreso(job.paso, job.total);
          if (job.listo) {
            detener();
            if (job.error) {
              mostrarError(job.error);
            } else {
              mostrarResultado(job.resultado);
            }
          }
        })
        .catch(function () {
          detener();
          mostrarError('Se perdió la conexión con el servidor.');
        });
    }, 1000);
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!form.checkValidity()) {
      form.classList.add('was-validated');
      return;
    }
    reiniciarUI();
    fetch('/generar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ solicitud: document.getElementById('solicitud').value }),
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.error) {
          detener();
          mostrarError(data.error);
          return;
        }
        consultarEstado(data.job_id);
      })
      .catch(function () {
        detener();
        mostrarError('No se pudo iniciar la generación.');
      });
  });
})();
</script>
</body>
</html>
